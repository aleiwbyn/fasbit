{% extends "base.html" %}
{% block titulo %}Usuarios — fasbit{% endblock %}

{% block contenido %}
<section class="cabecera-vista">
  <h1>Usuarios</h1>
  <p>Crea cuentas nuevas, elige su permiso y activa o desactiva su acceso.</p>
</section>

<section class="panel-sistema">
  <div class="panel-cabecera">
    <h2>Agregar nuevo usuario</h2>
  </div>
  <form
    method="post"
    action="{{ url_for('usuarios.crear') }}"
    hx-post="{{ url_for('usuarios.crear') }}"
    hx-target="#contenedor-tabla-usuarios"
  >
    <div class="grid-campos">
      <label>Usuario
        <input type="text" name="usuario" placeholder="Ej. operador3" required>
      </label>

      <label>Nombre completo
        <input type="text" name="nombre_completo" placeholder="Nombre y apellido" required>
      </label>

      <label>Tipo de cuenta
        <select name="rol" required>
          {% for r in ROLES_VALIDOS %}
          <option value="{{ r }}">{{ ETIQUETAS_ROL[r] }}</option>
          {% endfor %}
        </select>
      </label>

      <label>Contraseña
        <input type="password" name="contrasena" minlength="6" placeholder="Mínimo 6 caracteres" required>
      </label>
    </div>

    <div class="barra-acciones">
      <button type="submit" class="btn-primario">Crear usuario</button>
    </div>
  </form>
</section>

<section class="panel-sistema">
  <div class="panel-cabecera">
    <h2>Usuarios registrados</h2>
  </div>
  {% include "parciales/_tabla_usuarios.html" %}
</section>
{% endblock %}
