[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fasbit"
version = "1.0.0"
description = "Sistema de control de cumplimiento SLA, admision operativa y penalidades en recepcion logistica."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",
    "werkzeug>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
fasbit = "fasbit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fasbit = ["templates/*.html", "templates/parciales/*.html", "static/*", "static/fuentes/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
