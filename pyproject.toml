[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fasbit"
version = "0.1.0"
description = "Planificador Inteligente de Rutas y Recepción de Abastecimiento (Prolog + Python)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "José Manuel Olarte Cortez" },
    { name = "Miguel Alejandro Auccaillo" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
fasbit = "fasbit.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

